<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>＝LOVE タイプ診断</title>
<style>
  :root{
    --pink:#ff4f9a;
    --pink-dark:#e73884;
    --pink-soft:#fff0f6;
    --ink:#25232a;
    --muted:#77727d;
    --line:#ece7ed;
    --card:#ffffff;
    --bg:#fff8fb;
    --shadow:0 16px 40px rgba(64,35,52,.10);
    --radius:24px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 12% 0%, #ffe6f1 0, transparent 28%),
      radial-gradient(circle at 88% 16%, #f5e9ff 0, transparent 25%),
      var(--bg);
    min-height:100vh;
  }
  button{font:inherit}
  .wrap{
    width:min(720px, calc(100% - 28px));
    margin:0 auto;
    padding:28px 0 48px;
  }
  .hero{
    text-align:center;
    padding:20px 8px 18px;
  }
  .badge{
    display:inline-flex;
    align-items:center;
    gap:7px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:999px;
    padding:7px 12px;
    font-size:12px;
    font-weight:700;
    color:var(--pink-dark);
    box-shadow:0 6px 18px rgba(64,35,52,.05);
  }
  h1{
    margin:14px 0 7px;
    font-size:clamp(30px, 8vw, 48px);
    line-height:1.1;
    letter-spacing:-.04em;
  }
  .lead{
    margin:0 auto;
    color:var(--muted);
    line-height:1.7;
    font-size:14px;
  }
  .card{
    background:rgba(255,255,255,.94);
    border:1px solid rgba(236,231,237,.95);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .intro{
    padding:30px 24px;
    text-align:center;
  }
  .intro-icon{
    font-size:54px;
    line-height:1;
    margin-bottom:12px;
  }
  .intro h2{
    margin:0 0 10px;
    font-size:24px;
  }
  .intro p{
    margin:0 auto 22px;
    color:var(--muted);
    line-height:1.75;
    max-width:520px;
    font-size:14px;
  }
  .primary, .secondary{
    width:100%;
    border:0;
    border-radius:16px;
    padding:15px 18px;
    font-weight:800;
    cursor:pointer;
    transition:.18s ease;
  }
  .primary{
    color:#fff;
    background:linear-gradient(135deg,var(--pink),#ff76af);
    box-shadow:0 10px 24px rgba(255,79,154,.24);
  }
  .primary:hover{transform:translateY(-1px)}
  .primary:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .secondary{
    background:#fff;
    color:var(--ink);
    border:1px solid var(--line);
  }

  .quiz{padding:24px}
  .topline{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:12px;
    color:var(--muted);
    font-size:12px;
    font-weight:700;
  }
  .progress{
    height:8px;
    background:#f1edf1;
    border-radius:999px;
    overflow:hidden;
    margin-bottom:26px;
  }
  .progress > div{
    height:100%;
    background:linear-gradient(90deg,var(--pink),#ff9ac5);
    border-radius:inherit;
    transition:width .25s ease;
  }
  .question{
    font-size:24px;
    line-height:1.35;
    font-weight:850;
    letter-spacing:-.02em;
    margin:0 0 18px;
  }
  .choices{
    display:grid;
    gap:10px;
  }
  .choice{
    width:100%;
    text-align:left;
    border:1.5px solid var(--line);
    background:#fff;
    border-radius:16px;
    padding:15px 16px;
    cursor:pointer;
    display:flex;
    align-items:flex-start;
    gap:12px;
    transition:.16s ease;
    color:var(--ink);
  }
  .choice:hover{
    border-color:#f6a9ca;
    background:#fffafd;
  }
  .choice.selected{
    border-color:var(--pink);
    background:var(--pink-soft);
    box-shadow:0 0 0 3px rgba(255,79,154,.08);
  }
  .choice-letter{
    flex:0 0 28px;
    width:28px;
    height:28px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:#f5f1f4;
    font-weight:900;
    font-size:12px;
  }
  .choice.selected .choice-letter{
    color:#fff;
    background:var(--pink);
  }
  .choice-text{
    line-height:1.5;
    font-weight:700;
    padding-top:3px;
  }
  .nav{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:20px;
  }

  .result{padding:26px}
  .result-head{text-align:center}
  .result-kicker{
    color:var(--pink-dark);
    font-size:13px;
    font-weight:900;
    letter-spacing:.08em;
  }
  .result-name{
    margin:5px 0 4px;
    font-size:clamp(34px, 9vw, 52px);
    letter-spacing:-.05em;
    line-height:1.1;
  }
  .result-match{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:8px;
    padding:8px 12px;
    border-radius:999px;
    background:var(--pink-soft);
    color:var(--pink-dark);
    font-weight:900;
    font-size:13px;
  }
  .result-desc{
    margin:18px auto 0;
    max-width:560px;
    color:#5e5962;
    line-height:1.8;
    font-size:14px;
  }
  .section-title{
    margin:30px 0 12px;
    font-size:17px;
  }
  .component-list{display:grid;gap:10px}
  .component-row{
    display:grid;
    grid-template-columns:100px 1fr 48px;
    align-items:center;
    gap:10px;
    font-size:13px;
  }
  .component-name{font-weight:800;white-space:nowrap}
  .bar{
    height:10px;
    background:#f0ecf0;
    border-radius:999px;
    overflow:hidden;
  }
  .bar > span{
    display:block;
    height:100%;
    border-radius:inherit;
    background:linear-gradient(90deg,var(--pink),#ff9ac5);
  }
  .pct{text-align:right;font-weight:900}
  .traits{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }
  .trait{
    border:1px solid var(--line);
    border-radius:16px;
    padding:13px;
    background:#fff;
  }
  .trait-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
    font-size:12px;
    font-weight:800;
    margin-bottom:7px;
  }
  .trait .bar{height:7px}
  .buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:26px;
  }
  .note{
    margin-top:18px;
    color:#918b95;
    font-size:11px;
    line-height:1.65;
    text-align:center;
  }
  .hidden{display:none!important}
  .toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%) translateY(20px);
    padding:10px 14px;
    border-radius:999px;
    background:#25232a;
    color:#fff;
    font-size:12px;
    font-weight:800;
    opacity:0;
    pointer-events:none;
    transition:.2s ease;
    z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:560px){
    .wrap{width:min(100% - 20px,720px);padding-top:16px}
    .hero{padding-top:12px}
    .quiz,.result{padding:20px 16px}
    .question{font-size:21px}
    .component-row{grid-template-columns:88px 1fr 42px}
    .traits{grid-template-columns:1fr}
    .buttons{grid-template-columns:1fr}
  }
</style>
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <div class="badge">💗 FAN MADE DIAGNOSIS</div>
      <h1>＝LOVE タイプ診断</h1>
      <p class="lead">10問で、あなたに近いメンバーと<br>「イコラブ成分」を診断。</p>
    </header>

    <section id="startCard" class="card intro">
      <div class="intro-icon">🧬</div>
      <h2>あなたは誰タイプ？</h2>
      <p>
        直感で4択を選ぶだけ。<br>
        10個の性格軸をもとに、メンバー10人との近さを計算します。
      </p>
      <button id="startBtn" class="primary">診断スタート</button>
    </section>

    <section id="quizCard" class="card quiz hidden" aria-live="polite">
      <div class="topline">
        <span id="qCount">QUESTION 1 / 10</span>
        <span>直感でOK！</span>
      </div>
      <div class="progress"><div id="progressBar" style="width:10%"></div></div>
      <h2 id="questionText" class="question"></h2>
      <div id="choices" class="choices"></div>
      <div class="nav">
        <button id="backBtn" class="secondary">← 戻る</button>
        <button id="nextBtn" class="primary" disabled>次へ →</button>
      </div>
    </section>

    <section id="resultCard" class="card result hidden">
      <div class="result-head">
        <div class="result-kicker">YOUR ＝LOVE TYPE</div>
        <h2 id="resultName" class="result-name"></h2>
        <div id="matchBadge" class="result-match"></div>
        <p id="resultDesc" class="result-desc"></p>
      </div>

      <h3 class="section-title">🧬 あなたの＝LOVE成分</h3>
      <div id="componentList" class="component-list"></div>

      <h3 class="section-title">📊 あなたの性格パラメータ</h3>
      <div id="traitList" class="traits"></div>

      <div class="buttons">
        <button id="shareBtn" class="primary">結果をシェア</button>
        <button id="retryBtn" class="secondary">もう一度診断</button>
      </div>
      <p class="note">
        ※公開情報を参考にしたファン向けエンタメ診断です。<br>
        本人の実際の性格・人物像を断定するものではありません。
      </p>
    </section>
  </main>

  <div id="toast" class="toast">コピーしました！</div>

<script>
const AXES = [
  {key:"social", label:"社交性"},
  {key:"lead", label:"リード性"},
  {key:"express", label:"感情表現"},
  {key:"plan", label:"計画性"},
  {key:"own", label:"我が道"},
  {key:"focus", label:"没頭度"},
  {key:"play", label:"遊び心"},
  {key:"gap", label:"ギャップ"},
  {key:"empathy", label:"寄り添い"},
  {key:"beauty", label:"美意識"}
];

const QUESTIONS = [
  {
    q:"初対面が多い場では？",
    main:"social", sub:"lead",
    answers:[

  },
  {
    q:"人前に立つと？",
    main:"express", sub:"gap",
    answers:[
      "テンションも雰囲気もかなり変わる",
      "感情は出るけど、普段とあまり変わらない",
      "スイッチは入るけど、表には出にくい",

    ]
  },
  {

    main:"plan", sub:"own",
    answers:[

  {

  },
  {

    main:"empathy", sub:"beauty",
    answers:[
      "相手好みで、見た目にもこだわる",
      "自分のセンスで「これ！」を選ぶ",
      "相手が使いやすそうな物を選ぶ",
      "無難で外さない物を選ぶ"
    ]
  },
  {
    q:"1人だけ静かな人がいたら？",
    main:"empathy", sub:"social",
    answers:[
      "そっと自分から話しかける",
      "気にかけつつ様子を見る",
      "普通に自分から話しかける",
      "無理には話しかけない"
    ]
  },
  {
    q:"みんなで何か企画するなら？",
    main:"lead", sub:"plan",
    answers:[
      "段取りを決めて引っ張る",
      "とりあえず動きながら引っ張る",
      "計画は考えるけど仕切りは任せる",
      "決まったことをやる"
    ]
  },
  {
    q:"友達と盛り上がってる時は？",
    main:"play", sub:"express",
    answers:[
      "テンション全開でボケる",
      "真顔でボケたり、静かにふざける",
      "リアクション大きめで笑う",
      "わりと落ち着いて楽しむ"
    ]
  },
  {
    q:"何も予定がない休日は？",
    main:"own", sub:"focus",
    answers:[
      "好きなことを1人でとことんやる",
      "気分のまま色々やる",
      "誰かと好きなことを楽しむ",
      "誘われたことに乗っかる"
    ]
  },
  {
    q:"特別な日に出かけるなら？",
    main:"gap", sub:"beauty",
    answers:[
      "普段と別人級に仕上げる",
      "見た目は普段通り、気持ちはON",
      "見た目はしっかり仕上げる",
      "いつも通りで行く"
    ]
  }
];

// 各質問の4択は [++, +-, -+, --]
// main軸を±25、sub軸を±15する。
const SIGNS = [[1,1],[1,-1],[-1,1],[-1,-1]];

const MEMBERS = [
  {
    name:"大谷映美里",
    p:[35,55,15,75,35,85,15,35,75,95],
    bias:0.04208561,
    desc:"こだわりや美意識を大切にしつつ、好きなものはしっかり深掘りするタイプ。自分なりの基準を持ちながら、相手への気遣いも忘れない傾向。"
  },
  {
    name:"大場花菜",
    p:[45,65,45,65,65,75,55,25,55,85],
    bias:0.03369883,
    desc:"アイデアやこだわりを形にするクリエイティブタイプ。自分の感覚を持ちながら、必要な場面では周りを動かしていける傾向。"
  },
  {
    name:"音嶋莉沙",
    p:[25,15,35,45,15,25,25,45,85,75],
    bias:-0.01363339,
    desc:"派手に前へ出るより、相手をよく見て寄り添うタイプ。やさしさや気配りがベースにあり、自然な距離感を大切にする傾向。"
  },
  {
    name:"齋藤樹愛羅",
    p:[5,5,75,5,55,55,75,55,25,45],
    bias:0.00613101,
    desc:"マイペースさと予測不能な遊び心が魅力のタイプ。自分から仕切るより、その瞬間の感覚やリアクションで場を面白くする傾向。"
  },
  {
    name:"佐々木舞香",
    p:[15,25,25,35,85,65,65,65,35,25],
    bias:0.00922894,
    desc:"自分のペースと世界観を大切にするタイプ。広く合わせるより、好きなものにじっくり入り込み、独自のテンポで楽しむ傾向。"
  },
  {
    name:"髙松瞳",
    p:[85,85,95,25,75,25,85,75,15,35],
    bias:-0.01895696,
    desc:"エネルギーとリアクションで場を動かすタイプ。自分の感覚を持ちながら、人前では一気にスイッチが入る傾向。"
  },
  {
    name:"瀧脇笙古",
    p:[55,75,15,95,25,35,15,5,5,5],
    bias:-0.03592267,
    desc:"段取りを組んで着実に進める実行派タイプ。感情やノリよりも、準備・継続・役割をしっかりこなす方向に強みが出やすい傾向。"
  },
  {
    name:"野口衣織",
    p:[65,35,85,15,95,95,95,85,45,55],
    bias:0.03579256,
    desc:"好きなものへの熱量と没頭力が強いタイプ。感情や遊び心も豊かで、自分の世界を思い切り楽しむ傾向。"
  },
  {
    name:"諸橋沙夏",
    p:[75,45,65,55,45,45,45,95,65,65],
    bias:-0.02056565,
    desc:"人との距離感を取りながら、本番では大きくスイッチが入るタイプ。普段と勝負どころのギャップが特徴になりやすい傾向。"
  },
  {
    name:"山本杏奈",
    p:[95,95,55,85,5,5,35,15,95,15],
    bias:-0.02772886,
    desc:"人と関わりながら全体をまとめるタイプ。周囲への気配りと段取り力が強く、みんなが動きやすい形を作る傾向。"
  }
];

const els = {
  startCard:document.getElementById("startCard"),
  quizCard:document.getElementById("quizCard"),
  resultCard:document.getElementById("resultCard"),
  startBtn:document.getElementById("startBtn"),
  qCount:document.getElementById("qCount"),
  progressBar:document.getElementById("progressBar"),
  questionText:document.getElementById("questionText"),
  choices:document.getElementById("choices"),
  backBtn:document.getElementById("backBtn"),
  nextBtn:document.getElementById("nextBtn"),
  resultName:document.getElementById("resultName"),
  matchBadge:document.getElementById("matchBadge"),
  resultDesc:document.getElementById("resultDesc"),
  componentList:document.getElementById("componentList"),
  traitList:document.getElementById("traitList"),
  shareBtn:document.getElementById("shareBtn"),
  retryBtn:document.getElementById("retryBtn"),
  toast:document.getElementById("toast")
};

let current = 0;
let answers = Array(QUESTIONS.length).fill(null);
let lastResult = null;

function showOnly(which){
  [els.startCard,els.quizCard,els.resultCard].forEach(x=>x.classList.add("hidden"));
  which.classList.remove("hidden");
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderQuestion(){
  const q = QUESTIONS[current];
  els.qCount.textContent = `QUESTION ${current+1} / ${QUESTIONS.length}`;
  els.progressBar.style.width = `${((current+1)/QUESTIONS.length)*100}%`;
  els.questionText.textContent = q.q;
  els.choices.innerHTML = "";
  const letters = ["A","B","C","D"];

  q.answers.forEach((txt,i)=>{
    const btn = document.createElement("button");
    btn.className = "choice" + (answers[current]===i ? " selected" : "");
    btn.type = "button";
    btn.innerHTML = `<span class="choice-letter">${letters[i]}</span><span class="choice-text">${txt}</span>`;
    btn.addEventListener("click",()=>{
      answers[current]=i;
      renderQuestion();
    });
    els.choices.appendChild(btn);
  });

  els.backBtn.disabled = current===0;
  els.nextBtn.disabled = answers[current]===null;
  els.nextBtn.textContent = current===QUESTIONS.length-1 ? "結果を見る" : "次へ →";
}

function getUserProfile(){
  const vals = Object.fromEntries(AXES.map(a=>[a.key,50]));
  QUESTIONS.forEach((q,qi)=>{
    const chosen = answers[qi];
    const [mainSign,subSign] = SIGNS[chosen];
    vals[q.main] += 25*mainSign;
    vals[q.sub] += 15*subSign;
  });
  return AXES.map(a=>Math.max(5,Math.min(95,vals[a.key])));
}

function centered(arr){ return arr.map(v=>v-50); }

function cosine(a,b){
  let dot=0,aa=0,bb=0;
  for(let i=0;i<a.length;i++){
    dot += a[i]*b[i];
    aa += a[i]*a[i];
    bb += b[i]*b[i];
  }
  if(!aa || !bb) return 0;
  return dot/(Math.sqrt(aa)*Math.sqrt(bb));
}

function softmax(scores,beta=4){
  const scaled = scores.map(s=>s*beta);
  const max = Math.max(...scaled);
  const exps = scaled.map(x=>Math.exp(x-max));
  const sum = exps.reduce((a,b)=>a+b,0);
  return exps.map(x=>x/sum);
}

function calculate(){
  const profile = getUserProfile();
  const u = centered(profile);

  const raw = MEMBERS.map(m=>cosine(u,centered(m.p)));
  // biasは「全4^10回答が等確率」という理論条件で、
  // メンバーごとの構造的な出やすさだけをほぼ均等化する校正値。
  const calibrated = raw.map((s,i)=>s+MEMBERS[i].bias);
  const winner = calibrated.indexOf(Math.max(...calibrated));
  const components = softmax(calibrated,4);

  // 一致度には均等化biasを入れない。純粋な形状類似度だけを表示。
  const match = Math.round(((raw[winner]+1)/2)*100);

  return {profile,raw,calibrated,winner,components,match};
}

function pctRoundTo100(probs){
  const raw = probs.map(p=>p*100);
  const floors = raw.map(Math.floor);
  let remain = 100 - floors.reduce((a,b)=>a+b,0);
  const order = raw
    .map((v,i)=>({i,frac:v-floors[i]}))
    .sort((a,b)=>b.frac-a.frac);
  for(let k=0;k<remain;k++) floors[order[k].i]++;
  return floors;
}

function renderResult(){
  lastResult = calculate();
  const winner = MEMBERS[lastResult.winner];
  const compPct = pctRoundTo100(lastResult.components);

  els.resultName.textContent = `${winner.name}タイプ`;
  els.matchBadge.textContent = `✨ タイプ一致度 ${lastResult.match}%`;
  els.resultDesc.textContent = winner.desc;

  const ranked = MEMBERS
    .map((m,i)=>({name:m.name,pct:compPct[i],score:lastResult.components[i]}))
    .sort((a,b)=>b.score-a.score);

  els.componentList.innerHTML = ranked.map(r=>`
    <div class="component-row">
      <div class="component-name">${r.name}</div>
      <div class="bar"><span style="width:${r.pct}%"></span></div>
      <div class="pct">${r.pct}%</div>
    </div>
  `).join("");

  els.traitList.innerHTML = AXES.map((a,i)=>`
    <div class="trait">
      <div class="trait-top"><span>${a.label}</span><span>${lastResult.profile[i]}</span></div>
      <div class="bar"><span style="width:${lastResult.profile[i]}%"></span></div>
    </div>
  `).join("");

  showOnly(els.resultCard);
}

function resetQuiz(){
  current=0;
  answers=Array(QUESTIONS.length).fill(null);
  lastResult=null;
  renderQuestion();
  showOnly(els.quizCard);
}

function shareText(){
  if(!lastResult) return "";
  const pct = pctRoundTo100(lastResult.components);
  const ranked = MEMBERS
    .map((m,i)=>({name:m.name,pct:pct[i],score:lastResult.components[i]}))
    .sort((a,b)=>b.score-a.score)
    .slice(0,3);

  return [
    "＝LOVE タイプ診断💗",
    `私は「${MEMBERS[lastResult.winner].name}タイプ」！`,
    `タイプ一致度 ${lastResult.match}%`,
    "",
    "🧬 イコラブ成分 TOP3",
    ...ranked.map((r,i)=>`${i+1}. ${r.name} ${r.pct}%`),
    "",
    "#イコラブタイプ診断"
  ].join("\n");
}

function showToast(msg="コピーしました！"){
  els.toast.textContent=msg;
  els.toast.classList.add("show");
  setTimeout(()=>els.toast.classList.remove("show"),1800);
}

els.startBtn.addEventListener("click",()=>{
  renderQuestion();
  showOnly(els.quizCard);
});

els.nextBtn.addEventListener("click",()=>{
  if(answers[current]===null) return;
  if(current < QUESTIONS.length-1){
    current++;
    renderQuestion();
  }else{
    renderResult();
  }
});

els.backBtn.addEventListener("click",()=>{
  if(current>0){
    current--;
    renderQuestion();
  }
});

els.retryBtn.addEventListener("click",resetQuiz);

els.shareBtn.addEventListener("click",async()=>{
  const text=shareText();
  if(navigator.share){
    try{
      await navigator.share({title:"＝LOVE タイプ診断",text});
      return;
    }catch(e){
      if(e && e.name==="AbortError") return;
    }
  }
  try{
    await navigator.clipboard.writeText(text);
    showToast();
  }catch(e){
    const ta=document.createElement("textarea");
    ta.value=text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
    showToast();
  }
});
</script>
</body>
</html>
